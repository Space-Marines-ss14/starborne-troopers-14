meta:
  format: 6
  postmapinit: false
tilemap:
  0: Space
  1: FloorSteel
entities:
- proto: ""
  entities:
  - uid: 1
    components:
    - type: MetaData
      name: ST14 Z0
    - type: Transform
    - type: Map
      mapPaused: True
    - type: GridTree
    - type: Broadphase
    - type: OccluderTree
    - type: MapGrid
      chunks:
        0,0:
          ind: 0,0
          tiles: 
          version: 6
    - type: BecomesStation
      id: ZLevelsTest
    - type: MapAtmosphere
      space: False
      mixture:
        volume: 2500
        immutable: True
        temperature: 293.15
        moles:
          Oxygen: 21.824879
          Nitrogen: 82.10312
    - type: MapLight
      ambientLightColor: '#CCCCCCFF'
    - type: Parallax
      parallax: Default
    - type: Physics
      bodyStatus: InAir
      angularDamping: 0.05
      linearDamping: 0.05
      fixedRotation: False
      bodyType: Dynamic
    - type: Fixtures
      fixtures: {}
    - type: Shuttle
    - type: Gravity
      gravityShakeSound: !type:SoundPathSpecifier
        path: /Audio/Effects/alert.ogg
    - type: DecalGrid
      chunkCollection:
        version: 2
        nodes: []
    - type: SpreaderGrid
    - type: GridPathfinding
# Ladder from Z0 up to Z1. Z1's floor only covers x5..10, y5..10, so (6,4) is
# empty one level up (the step-up target) while (6,5) is solid (the landing).
# Walk north into it from the spawn tile below.
- proto: CEZLevelLadderWooden
  entities:
  - uid: 3
    components:
    - type: Transform
      pos: 6.5,4.5
      parent: 1
- proto: SpawnPointLatejoin
  entities:
  - uid: 2
    components:
    - type: Transform
      pos: 6.5,3.5
      parent: 1
...
