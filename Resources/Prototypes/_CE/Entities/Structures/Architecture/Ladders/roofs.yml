# Roof tiles: climbable cover tiles placed on a lower level so the level above can be walked on.
#
# Ported 1:1 from CrystallEdge (MIT-sublicensed). The per-colour destructible layers
# (CEZLevelsLadderRoof{Red,Green,Blue}Base) existed upstream only to override the drop spawn with the
# matching CE floor-tile item; with the CE content economy stripped they collapsed into the shared
# RoofBase definition below, so the colour variants now only differ by sprite.

- type: entity
  id: CEZLevelsLadderRoofBase
  name: roof tile
  description: Roof tiles, for covering building roofs.
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Red

- type: entity
  parent:
  - CEZLevelLadderBase
  - CEZLevelsLadderRoofBase
  id: CEZLevelsLadderRoofRed
  name: red roof
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/roof_red.rsi

- type: entity
  parent:
  - CEZLevelLadderCornerBase
  - CEZLevelsLadderRoofBase
  id: CEZLevelsLadderRoofRedCorner
  name: red roof
  suffix: Corner
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/roof_red.rsi

- type: entity
  parent:
  - CEZLevelLadderCornerInnerBase
  - CEZLevelsLadderRoofBase
  id: CEZLevelsLadderRoofRedCornerInner
  name: red roof
  suffix: Inner Corner
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/roof_red.rsi

