# Z-level ladder/stairs family.
#
# A ladder is a static ramp entity placed on ONE tile: its CEZLevelHighGround heightCurve maps the
# tile's local position to a "ground height" in level units. When the curve reaches >= 1 at the far
# edge, walking past it makes the z-physics step the entity up on the next map (TryMoveUp), and the
# tile directly ABOVE must be empty for that to work. Going down is just walking off the top edge.
#
# heightCurve [1.05, 1.05, 0.1] with the default rotation (-90deg, i.e. Direction.South => the
# plateau sits on the NORTH edge): approach from the SOUTH, climb NORTH.
#
# Ported 1:1 from CrystallEdge (MIT-sublicensed). CE content economy stripped: no construction
# graphs, CE material spawns retargeted to vanilla.

- type: entity
  id: CEZLevelLadderBase
  abstract: true
  parent: BaseStructure
  name: stairs
  description: Be careful, the higher you ascend, the more painful the fall.
  placement:
      mode: SnapgridCenter
      snap:
      - Wall
  components:
  - type: CEAutoTilePlacement
    tile: Plating
  - type: PlacementReplacement
    key: walls
  # No Occluder here: upstream has none on the straight ladder. An occluder feeds the client's
  # light/shadow pass (Clyde.LightRendering), so a stray one casts a bogus shadow and leaves a
  # light-bleed seam across the tall 32x78 sprite. Only the inner corner is a real occluder.
  - type: Sprite
    state: straight
    drawdepth: Mobs
  - type: Transform
    anchored: True
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      hard:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,0.5,0.5,0.6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
      slowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: CEZLevelHighGround
    stick: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.1
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.3
    sprintSpeedModifier: 0.3

- type: entity
  parent: CEZLevelLadderBase
  id: CEZLevelLadderCornerBase
  abstract: true
  placement:
      mode: SnapgridCenter
      snap:
      - Wall
  components:
  - type: Sprite
    state: corner
  - type: Occluder
    enabled: false
  - type: CEZLevelHighGround
    corner: true
    heightCurve:
    - 1.05
    - 1.05
    - 0.5
    - 0.1
  - type: Fixtures
    fixtures:
      hard:
        shape:
          !type:PhysShapeAabb
          bounds: "0.5,0.5,0.6,0.6"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
        hard: true
      slowdown:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false

- type: entity
  parent: CEZLevelLadderCornerBase
  id: CEZLevelLadderCornerInnerBase
  abstract: true
  placement:
      mode: SnapgridCenter
      snap:
      - Wall
  components:
  # Upstream writes `boundingBox: "-0.5,-0.5,0.5,0.5"`, but this fork's OccluderComponent has no
  # BoundingBox field (only Enabled + polygon, see OccluderComponent.cs), so the full-tile box is
  # spelled out as a polygon. Same shape, just the field this engine actually has.
  - type: Occluder
    enabled: true
    polygon:
    - "-0.5,-0.5"
    - "0.5,-0.5"
    - "0.5,0.5"
    - "-0.5,0.5"
  - type: Sprite
    state: internal_corner
