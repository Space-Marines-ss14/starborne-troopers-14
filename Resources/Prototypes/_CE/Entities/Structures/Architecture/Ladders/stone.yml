- type: entity
  id: CEZLevelsLadderStoneBase
  abstract: true
  name: stone ladder
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/stone.rsi
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent:
  - CEZLevelLadderBase
  - CEZLevelsLadderStoneBase
  id: CEZLevelLadderStone
  name: stone ladder

- type: entity
  parent:
  - CEZLevelLadderCornerBase
  - CEZLevelsLadderStoneBase
  id: CEZLevelLadderStoneCorner
  name: stone ladder
  suffix: Corner

- type: entity
  parent:
  - CEZLevelLadderCornerInnerBase
  - CEZLevelsLadderStoneBase
  id: CEZLevelLadderStoneCornerInner
  name: stone ladder
  suffix: Inner Corner
