- type: entity
  id: CEZLevelsLadderWoodenBase
  abstract: true
  name: wooden ladder
  components:
  - type: Sprite
    sprite: _CE/Structures/Architecture/Ladders/wooden.rsi
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 2
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent:
  - CEZLevelLadderBase
  - CEZLevelsLadderWoodenBase
  id: CEZLevelLadderWooden
  name: wooden ladder

- type: entity
  parent:
  - CEZLevelLadderCornerBase
  - CEZLevelsLadderWoodenBase
  id: CEZLevelLadderWoodenCorner
  name: wooden ladder
  suffix: Corner

- type: entity
  parent:
  - CEZLevelLadderCornerInnerBase
  - CEZLevelsLadderWoodenBase
  id: CEZLevelLadderWoodenCornerInner
  name: wooden ladder
  suffix: Inner Corner
